services:
  - type: web
    name: campus-placement-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: DATABASE_URL
        value: "sqlite:///./campus_placement.db"
    healthCheckPath: /health
    autoDeploy: true
